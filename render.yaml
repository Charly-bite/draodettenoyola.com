services:
  - type: web
    name: dra-odette-page
    env: node
    domains:
      - draodettenoyola.com
      - www.draodettenoyola.com
    buildCommand: "npm install"
    startCommand: "node server.js"
    pullRequestPreviewsEnabled: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ODETTE_BRIDGE_KEY
        sync: false
      - key: WAOS_BRIDGE_URLS
        sync: false
      - key: HEATMAP_SYNC_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
